{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-card card">
<h1>{{ title }}</h1>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<div class="actions"><a class="btn" href="{% url back %}">Cancel</a><button class="btn primary" type="submit">Save</button></div>
</form>
</div>
{% endblock %}
